<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <rect width="1200" height="640" fill="#ffffff"/>
  <text x="30" y="36" font-size="22" font-weight="bold" fill="#0b2b3a">ShopSmart on AWS: single EC2 host (v1.1.0-aws)</text>
  <text x="30" y="60" fill="#475569">Region ap-southeast-1 (Singapore) · https://52-221-80-114.sslip.io · fictional data and simulated checkout only</text>

  <!-- Browser -->
  <rect x="30" y="250" width="180" height="120" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="120" y="290" text-anchor="middle" font-weight="bold" fill="#0c4a6e">Visitor's browser</text>
  <text x="120" y="312" text-anchor="middle" fill="#0c4a6e">React + Vite build</text>
  <text x="120" y="332" text-anchor="middle" fill="#0c4a6e">session cookie: HttpOnly,</text>
  <text x="120" y="350" text-anchor="middle" fill="#0c4a6e">Secure, SameSite=Lax</text>

  <!-- AWS boundary -->
  <rect x="270" y="90" width="900" height="520" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="290" y="116" font-weight="bold" fill="#9a3412">AWS account (Free plan, credits) · default VPC · Elastic IP 52.221.80.114</text>

  <!-- Security group -->
  <rect x="300" y="135" width="840" height="455" rx="12" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
  <text x="320" y="160" font-weight="bold" fill="#713f12">Security group shopsmart-web</text>
  <text x="320" y="180" fill="#713f12">Inbound: 80, 443 from 0.0.0.0/0 · 22 only from the EC2 Instance Connect prefix list · 3000 and 5432 NOT open</text>

  <!-- EC2 instance -->
  <rect x="330" y="200" width="780" height="370" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="350" y="226" font-weight="bold" fill="#0f172a">EC2 shopsmart-demo · Ubuntu 24.04 · t3.micro · 20 GiB gp3</text>

  <!-- Caddy -->
  <rect x="360" y="255" width="220" height="130" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="470" y="282" text-anchor="middle" font-weight="bold" fill="#14532d">Caddy (public entry)</text>
  <text x="470" y="304" text-anchor="middle" fill="#14532d">:443 HTTPS (Let's Encrypt)</text>
  <text x="470" y="322" text-anchor="middle" fill="#14532d">:80 redirects to HTTPS</text>
  <text x="470" y="342" text-anchor="middle" fill="#14532d">serves frontend/dist</text>
  <text x="470" y="360" text-anchor="middle" fill="#14532d">SPA rewrite to index.html</text>

  <!-- Express -->
  <rect x="650" y="255" width="220" height="130" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="760" y="282" text-anchor="middle" font-weight="bold" fill="#4c1d95">Express API</text>
  <text x="760" y="304" text-anchor="middle" fill="#4c1d95">127.0.0.1:3000 (internal)</text>
  <text x="760" y="322" text-anchor="middle" fill="#4c1d95">systemd, restarts + boot</text>
  <text x="760" y="342" text-anchor="middle" fill="#4c1d95">sessions · order ownership</text>
  <text x="760" y="360" text-anchor="middle" fill="#4c1d95">validation · logs: journald</text>

  <!-- Mock AI -->
  <rect x="920" y="255" width="170" height="130" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="1005" y="282" text-anchor="middle" font-weight="bold" fill="#78350f">Mock AI provider</text>
  <text x="1005" y="304" text-anchor="middle" fill="#78350f">AI_PROVIDER=mock</text>
  <text x="1005" y="322" text-anchor="middle" fill="#78350f">in-process, no key,</text>
  <text x="1005" y="340" text-anchor="middle" fill="#78350f">no network call;</text>
  <text x="1005" y="358" text-anchor="middle" fill="#78350f">labeled in the UI</text>

  <!-- PostgreSQL -->
  <rect x="650" y="430" width="220" height="115" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="760" y="457" text-anchor="middle" font-weight="bold" fill="#1e3a8a">PostgreSQL 16</text>
  <text x="760" y="479" text-anchor="middle" fill="#1e3a8a">localhost:5432 (internal)</text>
  <text x="760" y="499" text-anchor="middle" fill="#1e3a8a">Product · Order · Customer</text>
  <text x="760" y="519" text-anchor="middle" fill="#1e3a8a">Session · nightly pg_dump</text>

  <!-- Secrets -->
  <rect x="360" y="430" width="220" height="115" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="470" y="457" text-anchor="middle" font-weight="bold" fill="#7f1d1d">backend/.env (mode 600)</text>
  <text x="470" y="479" text-anchor="middle" fill="#7f1d1d">DATABASE_URL (secret)</text>
  <text x="470" y="499" text-anchor="middle" fill="#7f1d1d">server-only; never in git,</text>
  <text x="470" y="519" text-anchor="middle" fill="#7f1d1d">VITE_ vars or screenshots</text>

  <!-- Arrows -->
  <line x1="210" y1="310" x2="356" y2="310" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="283" y="300" text-anchor="middle" fill="#1f2937">① HTTPS 443</text>
  <line x1="580" y1="320" x2="646" y2="320" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="613" y="310" text-anchor="middle" fill="#1f2937">② /api/*</text>
  <line x1="760" y1="385" x2="760" y2="426" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="768" y="412" fill="#1f2937">③ SQL</text>
  <line x1="870" y1="320" x2="916" y2="320" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="893" y="310" text-anchor="middle" fill="#1f2937">④</text>
  <line x1="580" y1="487" x2="646" y2="487" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <text x="30" y="420" fill="#334155" font-size="12">Admin: EC2 Instance Connect</text>
  <text x="30" y="436" fill="#334155" font-size="12">(browser SSH, port 22, AWS</text>
  <text x="30" y="452" fill="#334155" font-size="12">prefix list only; no key file)</text>
</svg>
